<style>

*{box-sizing:border-box}body{margin:0;font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}button{font:inherit;cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:3px solid #8bd1c8;outline-offset:2px}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:var(--navy);color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:42px;height:42px;background:#d5f2ec;color:var(--navy);border-radius:13px;display:grid;place-items:center;font-size:23px;font-weight:800}.brand-name{font-size:20px;font-weight:800;letter-spacing:-.5px}.brand-sub{font-size:11px;color:#bed2dc;margin-top:4px}.nav-label{color:#9ebac7;font-size:11px;font-weight:700;letter-spacing:1px;padding:0 13px;margin-bottom:7px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#d8e5ea;text-align:left;padding:13px 14px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px}.nav button .ico{width:22px;text-align:center;font-size:17px}.nav button.active,.nav button:hover{background:#2b5368;color:#fff}.side-note{margin-top:auto;background:#23485d;border:1px solid #396176;padding:16px;border-radius:13px;font-size:12px;line-height:1.6;color:#d7e5eb}.side-note strong{display:block;color:#fff;font-size:13px;margin-bottom:6px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;gap:20px}.crumb{color:var(--muted);font-size:13px}.top-right{display:flex;align-items:center;gap:12px}.status-pill{font-size:12px;background:var(--mint);color:var(--teal);padding:8px 11px;border-radius:30px;font-weight:700}.avatar{width:36px;height:36px;border-radius:50%;background:#dcefeb;color:var(--teal);display:grid;place-items:center;font-weight:800}.content{padding:34px 38px 50px;max-width:1400px;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:25px}.eyebrow{color:var(--teal);font-size:12px;font-weight:800;letter-spacing:1.2px;margin-bottom:9px}.page-title h1{font-size:29px;letter-spacing:-1px;margin:0 0 9px;color:var(--navy)}.page-title p{color:var(--muted);margin:0;line-height:1.6}.btn{padding:11px 16px;border-radius:9px;background:var(--teal);color:white;font-weight:700;transition:.15s}.btn:hover{background:#19786f}.btn.secondary{background:#edf4f6;color:var(--navy)}.btn.secondary:hover{background:#dfecef}.btn.outline{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.small{padding:8px 11px;font-size:13px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:25px}.panel,.stat,.skill-card{background:#fff;border:1px solid var(--line);border-radius:15px}.stat{padding:20px}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.stat-icon{width:36px;height:36px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:17px}.stat-value{font-size:29px;font-weight:800;color:var(--navy);margin:12px 0 5px}.stat-foot{font-size:12px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 14px}.section-head h2{margin:0;font-size:18px;color:var(--navy)}.section-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.two-col{grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr)}.panel{padding:22px}.progress-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #edf1f4}.progress-row:last-child{border-bottom:0}.mini-icon{width:43px;height:43px;border-radius:12px;background:#edf6f4;display:grid;place-items:center;font-size:20px;flex-shrink:0}.progress-info{flex:1;min-width:0}.progress-info strong{display:block;font-size:14px;margin-bottom:7px}.progress-info small{color:var(--mute 1;margin-top:18px}.step-list{display:grid;gap:8px}.step-item{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:left;color:var(--text)}.step-item.active{border-color:var(--teal);background:var(--mint)}.step-item .num{width:25px;height:25px;display:grid;place-items:center;background:#edf2f4;border-radius:50%;font-size:12px;font-weight:800}.step-item.active .num{background:var(--teal);color:#fff}.step-item.done .num{background:#dff3e9;color:var(--green)}.step-item span:last-child{font-size:13px}.quiz-list{display:grid;gap:10px;margin:18px 0}.quiz-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}.quiz-item .handle{color:#8a9ba5;font-size:18px}.quiz-item .qtext{flex:1;font-size:14px}.quiz-item .move{display:flex;gap:5px}.icon-btn{width:30px;height:30px;border:1px solid var(--line);background:#f8fafb;border-radius:7px;color:var(--navy)}.feedback{padding:15px;border-radius:10px;margin-top:15px;line-height:1.7;font-size:14px}.feedback.good{background:#eaf7ef;color:#216d50}.feedback.bad{background:#fff0ee;color:#9b3d3d}.check-row{display:flex;gap:12px;align-items:flex-start;padding:15px 0;border-bottom:1px solid #edf1f4}.check-row:last-child{border-bottom:0}.check-row input{width:18px;height:18px;accent-color:var(--teal);margin-top:2px}.check-row strong{font-size:14px}.check-row p{font-size:12px;color:var(--muted);margin:5px 0 0;line-height:1.6}.notice{padding:13px 15px;background:#eef6f8;border-radius:9px;color:#456570;font-size:13px;line-height:1.7;margin-bottom:18px}.empty{padding:32px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--navy);margin-bottom:8px}.history-list{display:grid;gap:10px}.history-item{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #edf1f4;gap:15px}.history-item:last-child{border-bottom:0}.history-item strong{font-size:14px}.history-item small{display:block;color:var(--muted);margin-top:5px}.score{font-size:18px;font-weight:800;color:var(--teal)}.footer{text-align:center;color:#92a0a9;font-size:11px;padding:25px 0 0}.toast{position:fixed;bottom:24px;right:25px;background:#18394e;color:white;padding:13px 17px;border-radius:10px;box-shadow:0 8px 30px #193b5222;z-index:10;display:none;font-size:13px}.toast.show{display:block}.hidden{display:none!important}
@media(max-width:1050px){.app{grid-template-columns:205px 1fr}.content{padding:28px 24px}.topbar{padding:0 24px}.stats{grid-template-columns:repeat(2,1fr)}.skill-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col,.study-layout{grid-template-columns:1fr}}
@media(max-width:720px){.app{display:block}.sidebar{padding:13px 14px;gap:12px}.brand{padding:0 4px}.brand-mark{width:35px;height:35px}.brand-name{font-size:17px}.brand-sub,.nav-label,.side-note{display:none}.nav{display:flex;overflow-x:auto;gap:5px}.nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.nav button .ico{width:auto}.topbar{height:54px;padding:0 17px}.content{padding:24px 16px}.page-title h1{font-size:24px}.page-title{align-items:center}.page-title .btn{display:none}.stats{gap:10px}.stat{padding:14px}.stat-value{font-size:24px}.skill-grid{grid-template-columns:1fr}.panel{padding:17px}.section-head{margin-top:22px}.crumb{font-size:12px}}

<script>
const skills = [
 {id:'hand',name:'손 위생',icon:'✋',level:'기초',desc:'감염 예방을 위한 손 위생 절차를 학습합니다.',purpose:'손에 있는 오염과 미생물의 전파 위험을 줄이기 위한 기본 간호 활동입니다.',materials:'손 위생 시설 또는 손 소독제',steps:[
  {title:'손 위생이 필요한 상황 확인',body:'손 위생이 필요한 시점인지 확인합니다. 기관의 감염관리 지침과 실습 지침을 따릅니다.',tip:'환자 접촉 전후 등 손 위생이 필요한 상황을 먼저 확인합니다.'},
  {title:'손과 손목의 장신구 확인',body:'실습 지침에 따라 손과 손목의 장신구 및 손톱 상태를 확인합니다.',tip:'학교와 실습기관의 복장 및 감염관리 기준을 우선합니다.'},
  {title:'손 씻기 또는 손 소독 수행',body:'상황에 맞는 방법을 선택하고 기관에서 정한 절차와 시간을 지켜 수행합니다.',tip:'손이 눈에 띄게 오염된 경우에는 비누와 물을 이용한 손 씻기가 필요합니다.'},
  {title:'손 전체를 빠짐없이 문지르기',body:'손바닥, 손등, 손가락 사이, 손가락 끝과 엄지 등 빠뜨리기 쉬운 부위를 포함합니다.',tip:'엄지와 손가락 끝은 놓치기 쉬우므로 의식적으로 확인합니다.'},
  {title:'마무리 및 상태 확인',body:'손 위생을 마친 뒤 손이 적절히 건조되었는지 확인하고 다음 간호 활동을 준비합니다.',tip:'수행 방법과 시점은 최신 감염관리 지침 및 기관 규정을 따릅니다.'}
 ]},
 {id:'vital',name:'활력징후 측정',icon:'♥',level:'기초',desc:'체온, 맥박, 호흡, 혈압 측정의 기본 흐름을 익힙니다.',purpose:'대상자의 기본적인 생리 상태를 확인하고 변화 여부를 파악합니다.',materials:'체온계, 시계, 혈압계, 청진기 등 필요한 측정 도구',steps:[
  {title:'대상자 확인 및 설명',body:'대상자를 확인하고 측정 목적과 방법을 설명합니다. 손 위생과 필요한 사생활 보호를 시행합니다.',tip:'대상자 확인은 기관의 환자 확인 절차를 따릅니다.'},
  {title:'필요한 물품 준비',body:'측정할 항목에 맞는 도구가 준비되어 있고 정상적으로 작동하는지 확인합니다.',tip:'장비 사용 전 상태와 대상자에게 맞는 측정 방법을 확인합니다.'},
  {title:'체온 측정',body:'대상자와 장비에 적합한 측정 부위를 선택하고 기기 사용 지침에 따라 측정합니다.',tip:'측정 부위와 방법에 따라 결과 해석이 달라질 수 있습니다.'},
  {title:'맥박과 호흡 측정',body:'맥박의 속도와 규칙성을 확인하고, 호흡은 대상자가 의식해 호흡 양상을 바꾸지 않도록 관찰합니다.',tip:'이상 소견이 있으면 실습 지침에 따라 재확인하고 보고합니다.'},
  {title:'혈압 측정',body:'대상자의 자세와 팔 위치를 적절히 맞추고 알맞은 커프를 사용해 혈압을 측정합니다.',tip:'측정 전 안정 시간과 자세 등은 기관 지침을 따릅니다.'},
  {title:'결과 기록 및 보고',body:'측정값과 측정 시각을 정확하게 기록하고, 이상 소견은 지도자에게 보고합니다.',tip:'정상 범위와 보고 기준은 대상자의 상태 및 기관 지침을 확인합니다.'}
 ]},
 {id:'injection',name:'근육주사 이론',icon:'＋',level:'중급',desc:'근육주사 전 확인 사항과 안전 원칙을 학습합니다.',purpose:'근육주사 관련 기본 원칙과 안전 확인 절차를 이해합니다.',materials:'학습용 체크리스트 및 학교 실습 자료',steps:[
  {title:'처방과 대상자 확인',body:'학교 실습 지침에 따라 처방, 대상자, 약물 관련 정보를 확인하는 원칙을 학습합니다.',tip:'실제 투약은 지도자의 감독과 기관의 투약 안전 절차에 따라야 합니다.'},
  {title:'알레르기 및 주의사항 확인',body:'알레르기, 금기사항, 약물 정보와 대상자의 상태를 확인해야 함을 이해합니다.',tip:'불확실하거나 상충하는 정보가 있으면 진행하지 않고 지도자에게 확인합니다.'},
  {title:'물품과 무균 원칙 확인',body:'필요한 물품과 유효기간, 포장 상태를 확인하고 무균 원칙의 중요성을 학습합니다.',tip:'오염이 의심되는 물품은 사용하지 않습니다.'},
  {title:'주사 부위 선정 원칙 학습',body:'부위 선정은 대상자의 상태, 약물 특성 및 학교에서 승인한 지침을 바탕으로 학습합니다.',tip:'실제 부위 선정과 수행은 반드시 지도자 및 기관 지침을 따릅니다.'},
  {title:'수행 후 관찰과 기록',body:'수행 후 대상자 상태를 관찰하고 필요한 사항을 기록·보고하는 원칙을 익힙니다.',tip:'이상 반응이 의심되면 즉시 지도자에게 알립니다.'}
 ]},
 {id:'bed',name:'침상 정리',icon:'▱',level:'기초',desc:'대상자의 안전과 편안함을 고려한 침상 정리 순서를 학습합니다.',purpose:'대상자의 안위와 안전을 유지하고 청결한 환경을 제공하기 위함입니다.',materials:'깨끗한 침구류와 필요한 보호구',steps:[

const state = loadState();
let page='home', selectedSkill='hand', stepIndex=0, quizSkill='hand', quizOrder=[], quizResult=null, checklistSkill='hand', mockSkill='hand', mockIndex=0, mockDone=false;
function loadState(){try{return JSON.parse(localStorage.getItem('skillmate_state'))||{learned:[],checks:{},history:[],wrong:{}}}catch(e){return {learned:[],checks:{},history:[],wrong:{}}}}
function saveState(){try{localStorage.setItem('skillmate_state',JSON.stringify(state))}catch(e){}}
function skill(id){return skills.find(s=>s.id===id)||skills[0]}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});
function setHeader(title){document.getElementById('crumb').textContent='스킬메이트 / '+title}
function titleBlock(kicker,title,desc,action=''){return `<div class="page-title"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function skillCard(s){const done=state.learned.includes(s.id);return `<article class="skill-card"><div class="card-top"><div class="mini-icon">${s.icon}</div><span class="tag ${done?'done':'pending'}">${done?'학습 완료':s.level}</span></div><h3>${s.name}</h3><p>${s.desc}</p><div class="card-actions"><button class="btn small" onclick="startStudy('${s.id}')">학습하기</button><button class="btn secondary small" onclick="startQuiz('${s.id}')">퀴즈</button></div></article>`}
function renderHome(){setHeader('대시보드');const completed=state.learned.length,total=skills.length;const attempts=state.history.length;const avg=attempts?Math.round(state.history.reduce((a,h)=>a+h.score,0)/attempts):0;const weakCount=Object.values(state.wrong).reduce((a,x)=>a+x.length,0);
return `${titleBlock('MY LEARNING','안녕하세요, 스킬메이트입니다.','기본 술기부터 환자 간호·안전관리까지 차근차근 연습해 보세요.','<button class="btn" onclick="go(\'study\')">학습 시작하기 →</button>')}
<div class="grid stats">
<div class="stat"><div class="stat-top">학습 완료 술기 <span class="stat-icon">✓</span></div><div class="stat-value">${completed}<span style="font-size:15px;color:#71838d;font-weight:500"> / ${total}</span></div><div class="stat-foot">학습 완료한 술기 수</div></div>
<div class="stat"><div class="stat-top">퀴즈 응시 <span class="stat-icon">↕</span></div><div class="stat-value">${attempts}<span style="font-size:15px;color:#71838d;font-weight:500"> 회</span></div><div class="stat-foot">지금까지의 퀴즈 기록</div></div>
<div class="stat"><div class="stat-top">평균 퀴즈 점수 <span class="stat-icon">▥</span></div><div class="stat-value">${attempts?avg:0}<span style="font-size:15px;color:#71838d;font-weight:500"> 점</span></div><div class="stat-foot">응시 기록 기준</div></div>
<div class="stat"><div class="stat-top">복습할 항목 <span class="stat-icon">◎</span></div><div class="stat-value">${weakCount}<span style="font-size:15px;color:#71838d;font-weight:500"> 개</span></div><div class="stat-foot">기록된 오답 항목 수</div></div>
</div>
<div class="grid two-col"><section><div class="section-head"><div><h2>기본 술기 및 환자 간호</h2><p>기본 술기부터 환자 관리·처치 관련 학습까지 선택할 수 있습니다.</p></div><button class="btn secondary small" onclick="go('study')">전체 보기</button></div><div class="grid skill-grid">${skills.slice(0,3).map(skillCard).join('')}</div></section>
<aside><div class="section-head"><div><h2>오늘의 학습 가이드</h2><p>짧게 연습하고 정확하게 확인하세요.</p></div></div><div class="daily-card"><div class="small-label">SKILL TIP</div><h3>순서와 이유를 함께 익히기</h3><p>단계를 외우는 데서 끝내지 말고, 각 단계가 필요한 이유와 주의사항도 함께 확인해 보세요.</p><button class="btn" onclick="startStudy('vital')">활력징후 학습하기</button></div><div class="panel"><h3 style="font-size:15px;margin:0 0 9px;color:var(--navy)">학습 진행률</h3><div style="display:flex;justify-content:space-between;font-size:13px"><span>전체 술기</span><strong>${Math.round(completed/total*100)}%</strong></div><div class="progress-bar" style="height:9px;margin:12px 0"><span style="width:${completed/total*100}%"></span></div><div class="tip">학습 완료 표시는 학습 자료를 확인했다는 의미이며, 실제 술기 수행 능력을 평가하는 것은 아닙니다.</div></div></aside></div>
<div class="section-head"><div><h2>전체 학습 목록</h2><p>기본 술기, 환자 간호, 안전관리와 처치 관찰 내용을 학습할 수 있습니다.</p></div></div><div class="grid skill-grid">${skills.slice(3).map(skillCard).join('')}</div><div class="footer">스킬메이트 · 간호학 학습 보조 서비스</div>`}
function renderStudy(){setHeader('술기 학습');const s=skill(selectedSkill);const st=s.steps[stepIndex];return `${titleBlock('SKILL STUDY','단계별 술기 학습','술기 수행 순서와 주의사항을 한 단계씩 확인하세요.')}
<div class="tabs">${skills.map(x=>`<button class="tab ${x.id===selectedSkill?'active':''}" onclick="startStudy('${x.id}')">${x.name}</button>`).join('')}</div>
<div class="study-layout"><section class="panel"><div class="step-count">STEP ${stepIndex+1} / ${s.steps.length} · ${s.name}</div><h2 class="study-step-title">${st.title}</h2><div class="study-body">${st.body}</div><div class="callout"><strong>주의사항</strong><br>${st.tip}</div><div style="display:flex;justify-content:space-between;gap:10px;margin-top:24px"><button class="btn secondary" onclick="changeStep(-1)" ${stepIndex===0?'disabled style="opacity:.45;cursor:not-allowed"':''}>← 이전 단계</button><button class="btn" onclick="changeStep(1)">${stepIndex===s.steps.length-1?'학습 완료':'다음 단계 →'}</button></div></section><aside class="panel"><h3 style="margin:0 0 15px;color:var(--navy)">학습 단계</h3><div class="step-list">${s.steps.map((x,i)=>`<button class="step-item ${i===stepIndex?'active':''} ${i<stepIndex?'done':''}" onclick="stepIndex=${i};render()"><span class="num">${i<stepIndex?'✓':i+1}</span><span>${x.title}</span></button>`).join('')}</div><div style="margin-top:20px"><button class="btn secondary" style="width:100%" onclick="startQuiz('${s.id}')">이 술기 퀴즈 풀기</button></div></aside></div><div class="footer">학습 자료는 학교 실습 지침과 지도자의 안내를 우선하여 확인하세요.</div>`}
function renderQuiz(){setHeader('순서 맞추기 퀴즈');const s=skill(quizSkill);if(!quizOrder.length)resetQuiz(false);return `${titleBlock('ORDER QUIZ','순서 맞추기 퀴즈','술기 단계를 올바른 순서로 배열한 뒤 정답을 확인하세요.')}<div class="tabs">${skills.map(x=>`<button class="tab ${x.id===quizSkill?'active':''}" onclick="startQuiz('${x.id}')">${x.name}</button>`).join('')}</div><div class="panel"><div class="notice"><strong>${s.name}</strong> 단계가 섞여 있습니다. 오른쪽 화살표 버튼으로 순서를 바꾸거나, 위·아래 버튼으로 정렬한 뒤 정답 확인을 눌러주세요.</div><div class="quiz-list">${quizOrder.map((idx,pos)=>`<div class="quiz-item"><span class="handle">⠿</span><span class="tag">${pos+1}</span><span class="qtext">${s.steps[idx].title}</span><div class="move"><button class="icon-btn" aria-label="위로 이동" title="위로 이동" onclick="moveQuiz(${pos},-1)" ${pos===0||quizResult?'disabled':''}>↑</button><button class="icon-btn" aria-label="아래로 이동" title="아래로 이동" onclick="moveQuiz(${pos},1)" ${pos===quizOrder.length-1||quizResult?'disabled':''}>↓</button></div></div>`).join('')}</div>${quizResult?`<div class="feedback ${quizResult.score===100?'good':'bad'}"><strong>결과: ${quizResult.score}점 (${quizResult.correct}/${s.steps.length}개 정답)</strong><br>${quizResult.score===100?'모든 단계를 올바르게 배열했습니다.':`틀린 단계가 ${s.steps.length-quizResult.correct}개 있습니다. 아래 정답 순서를 확인하고 다시 연습해 보세요.`}</div><div class="panel" style="margin-top:14px;background:#f9fbfc"><strong>올바른 순서</strong><ol style="line-height:1.9;margin-bottom:0">${s.steps.map(x=>`<li>${x.title}</li>`).join('')}</ol></div><div style="display:flex;gap:10px;margin-top:18px"><button class="btn" onclick="resetQuiz(true)">다시 풀기</button><button class="btn secondary" onclick="go('weak')">오답 확인</button></div>`:`<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="submitQuiz()">정답 확인</button><button class="btn secondary" onclick="resetQuiz(true)">순서 다시 섞기</button></div>`}</div><div class="footer">퀴즈는 학습 보조용이며 실제 임상 수행 능력을 인증하지 않습니다.</div>`}
function renderChecklist(){setHeader('실습 체크리스트');const s=skill(checklistSkill);const checks=state.checks[s.id]||[];const count=checks.filter(Boolean).length;return `${titleBlock('PRACTICE CHECKLIST','실습 체크리스트','직접 연습하면서 수행한 단계를 체크하고 빠뜨린 항목을 확인하세요.')}<div class="tabs">${skills.map(x=>`<button class="tab ${x.id===checklistSkill?'active':''}" onclick="checklistSkill='${x.id}';render()">${x.name}</button>`).join('')}</div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><h2 style="margin:0 0 7px;color:var(--navy)">${s.name}</h2><p style="margin:0;color:var(--muted);font-size:13px">체크한 단계 ${count} / ${s.steps.length}</p></div><button class="btn secondary small" onclick="resetChecks('${s.id}')">체크 초기화</button></div><div class="progress-bar" style="height:8px;margin:17px 0 7px"><span style="width:${count/s.steps.length*100}%"></span></div><div class="tip">${count===s.steps.length?'모든 항목을 체크했습니다. 실제 수행 능력은 지도자 평가를 통해 확인하세요.':`아직 ${s.steps.length-count}개 항목을 확인하지 않았습니다.`}</div><div style="margin-top:17px">${s.steps.map((st,i)=>`<label class="check-row"><input type="checkbox" ${checks[i]?'checked':''} onchange="toggleCheck('${s.id}',${i},this.checked)"><span><strong>${st.title}</strong><p>${st.tip}</p></span></label>`).join('')}</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn" onclick="saveChecklist('${s.id}')">연습 결과 저장</button><button class="btn secondary" onclick="startStudy('${s.id}')">학습 내용 다시 보기</button></div></div><div class="footer">체크리스트는 자기 점검용입니다. 실제 수행은 학교 실습 지침을 따르세요.</div>`}
function renderMock(){setHeader('실습 전 모의 연습');const s=skill(mockSkill);if(!state.mockChecks)state.mockChecks={};if(!state.mockFlags)state.mockFlags={};const marked=state.mockChecks[s.id]||[];const flags=state.mockFlags[s.id]||[];const done=mockDone||mockIndex>=s.steps.length;const st=s.steps[Math.min(mockIndex,s.steps.length-1)];return `${titleBlock('PRACTICE SIMULATION','실습 전 모의 연습','술기 단계를 하나씩 확인하며 수행 과정을 스스로 점검하세요.')}<div class="tabs">${skills.map(x=>`<button class="tab ${x.id===mockSkill?'active':''}" onclick="startMock('${x.id}')">${x.name}</button>`).join('')}</div><div class="study-layout"><section class="panel">${done?`<div class="step-count">모의 연습 결과</div><h2 class="study-step-title">연습이 끝났습니다.</h2><p style="color:var(--muted);line-height:1.8">확인 완료: ${marked.filter(Boolean).length} / ${s.steps.length}단계<br>복습 필요: ${flags.length}단계</p>${flags.length?`<div class="feedback bad"><strong>다시 확인할 단계</strong><br>${flags.map(i=>s.steps[i].title).join('<br>')}</div>`:`<div class="feedback good">복습 필요로 표시한 단계가 없습니다. 실제 수행 능력은 지도자 평가를 통해 확인하세요.</div>`}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn" onclick="startMock('${s.id}')">다시 연습하기</button><button class="btn secondary" onclick="go('checklist')">체크리스트로 이동</button></div>`:`<div class="step-count">${s.name} · STEP ${mockIndex+1} / ${s.steps.length}</div><div class="progress-bar" style="height:8px;margin:12px 0 20px"><span style="width:${(mockIndex/s.steps.length)*100}%"></span></div><h2 class="study-step-title">${st.title}</h2><p class="study-body">${st.body}</p><div class="callout"><strong>확인할 점</strong><br>${st.tip}</div><div class="notice" style="margin-top:18px;margin-bottom:0">해당 단계를 수행했다고 생각하면 ‘수행 확인’을 누르세요. 더 연습이 필요하면 ‘복습 필요’를 선택할 수 있습니다.</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn" onclick="markMock(true)">✓ 수행 확인</button><button class="btn secondary" onclick="markMock(false)">복습 필요</button></div><div style="margin-top:15px"><button class="btn outline small" onclick="startStudy('${s.id}',${mockIndex})">학습 설명 다시 보기</button></div>`}</section><aside class="panel"><h3 style="margin:0 0 15px;color:var(--navy)">모의 연습 진행 상황</h3><div class="step-list">${s.steps.map((x,i)=>{const isFlag=flags.includes(i);const isChecked=marked[i]===true;const current=!done&&i===mockIndex;return `<div class="step-item ${current?'active':''} ${isChecked?'done':''}"><span class="num">${isChecked?'✓':isFlag?'!':i+1}</span><span>${x.title}${isFlag?'<br><small style="color:#a9631a">복습 필요</small>':''}</span></div>`}).join('')}</div><div class="tip" style="margin-top:15px">모의 연습은 자기 점검을 위한 기능입니다. 체크 결과가 실제 간호 술기 능력을 인증하지는 않습니다.</div></aside></div>`}
function startMock(id){mockSkill=id;mockIndex=0;mockDone=false;if(!state.mockChecks)state.mockChecks={};if(!state.mockFlags)state.mockFlags={};state.mockChecks[id]=[];state.mockFlags[id]=[];saveState();go('mock')}
function markMock(passed){const s=skill(mockSkill);if(mockIndex>=s.steps.length)return;if(!state.mockChecks)state.mockChecks={};if(!state.mockFlags)state.mockFlags={};if(!state.mockChecks[s.id])state.mockChecks[s.id]=[];if(!state.mockFlags[s.id])state.mockFlags[s.id]=[];state.mockChecks[s.id][mockIndex]=!!passed;if(passed){state.mockFlags[s.id]=state.mockFlags[s.id].filter(i=>i!==mockIndex)}else if(!state.mockFlags[s.id].includes(mockIndex)){state.mockFlags[s.id].push(mockIndex)}mockIndex++;if(mockIndex>=s.steps.length)mockDone=true;saveState();render();if(mockDone)toast('모의 연습 결과가 저장되었습니다.')}
function renderWeak(){setHeader('오답·취약 단계');const items=[];Object.keys(state.wrong).forEach(id=>{const s=skill(id);state.wrong[id].forEach((idx)=>items.push({s,idx}))});return `${titleBlock('REVIEW','오답 · 취약 단계','퀴즈에서 틀린 단계와 반복 복습이 필요한 항목을 확인하세요.')}<div class="panel">${items.length?`<div class="notice">퀴즈에서 틀린 단계가 표시됩니다. 같은 술기를 다시 풀고 해설을 확인해 보세요.</div><div class="history-list">${items.map(({s,idx})=>`<div class="history-item"><div><strong>${s.name} · ${s.steps[idx].title}</strong><small>${s.steps[idx].tip}</small></div><button class="btn secondary small" onclick="startStudy('${s.id}',${idx})">복습하기</button></div>`).join('')}</div><div style="margin-top:18px"><button class="btn outline small" onclick="clearWrong()">오답 기록 지우기</button></div>`:`<div class="empty"><strong>아직 기록된 오답이 없습니다.</strong>퀴즈를 풀면 틀린 단계가 여기에 표시됩니다.<br><button class="btn" style="margin-top:15px" onclick="go('quiz')">퀴즈 시작하기</button></div>`}</div>`}
function renderHistory(){setHeader('학습 기록');return `${titleBlock('LEARNING HISTORY','학습 기록','이전에 학습한 내용과 퀴즈 결과를 확인하세요.')}<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0;color:var(--navy);font-size:18px">퀴즈 기록</h2><button class="btn outline small" onclick="clearHistory()">퀴즈 기록 삭제</button></div>${state.history.length?`<div class="history-list" style="margin-top:12px">${[...state.history].reverse().map(h=>`<div class="history-item"><div><strong>${escapeHtml(h.name)}</strong><small>${escapeHtml(h.date)} · ${h.correct}/${h.total}개 정답</small></div><div class="score">${h.score}점</div></div>`).join('')}</div>`:`<div class="empty"><strong>아직 퀴즈 기록이 없습니다.</strong>퀴즈를 완료하면 점수와 응시 기록이 여기에 저장됩니다.</div>`}</div><div class="panel" style="margin-top:18px"><h2 style="margin:0 0 14px;color:var(--navy);font-size:18px">술기별 학습 현황</h2>${skills.map(s=>`<div class="progress-row"><div class="mini-icon">${s.icon}</div><div class="progress-info"><strong>${s.name}</strong><small>${state.learned.includes(s.id)?'학습 자료 확인 완료':'아직 학습하지 않음'}</small><div class="progress-bar"><span style="width:${state.learned.includes(s.id)?100:0}%"></span></div></div><span class="tag ${state.learned.includes(s.id)?'done':'pending'}">${state.learned.includes(s.id)?'완료':'미완료'}</span></div>`).join('')}</div>`}
function render(){const c=document.getElementById('content');if(page==='home')c.innerHTML=renderHome();else if(page==='study')c.innerHTML=renderStudy();else if(page==='quiz')c.innerHTML=renderQuiz();else if(page==='checklist')c.innerHTML=renderChecklist();else if(page==='mock')c.innerHTML=renderMock();else if(page==='weak')c.innerHTML=renderWeak();else if(page==='history')c.innerHTML=renderHistory()}
function startStudy(id,step=0){selectedSkill=id;stepIndex=Math.max(0,Math.min(step,skill(id).steps.length-1));go('study')}
function changeStep(d){const s=skill(selectedSkill);if(stepIndex+d<0)return;if(stepIndex+d>=s.steps.length){if(!state.learned.includes(s.id))state.learned.push(s.id);saveState();toast('학습 완료 상태가 저장되었습니다.');go('study');return}stepIndex+=d;render()}
function startQuiz(id){quizSkill=id;resetQuiz(false);go('quiz')}
function resetQuiz(notify){const s=skill(quizSkill);quizOrder=s.steps.map((_,i)=>i);for(let i=quizOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[quizOrder[i],quizOrder[j]]=[quizOrder[j],quizOrder[i]]}if(quizOrder.every((v,i)=>v===i)&&quizOrder.length>1)[quizOrder[0],quizOrder[1]]=[quizOrder[1],quizOrder[0]];quizResult=null;if(notify)toast('단계 순서를 다시 섞었습니다.');if(page==='quiz'&&notify)render()}
function moveQuiz(pos,d){const next=pos+d;if(next<0||next>=quizOrder.length||quizResult)return;[quizOrder[pos],quizOrder[next]]=[quizOrder[next],quizOrder[pos]];render()}
function submitQuiz(){if(!quizOrder.length){toast('퀴즈 단계가 없습니다.');return}let correct=0;quizOrder.forEach((idx,pos)=>{if(idx===pos)correct++});const s=skill(quizSkill);const score=Math.round(correct/s.steps.length*100);quizResult={correct,score};const wrongIndices=[];quizOrder.forEach((idx,pos)=>{if(idx!==pos){if(!wrongIndices.includes(idx))wrongIndices.push(idx);if(!wrongIndices.includes(pos))wrongIndices.push(pos)}});if(wrongIndices.length){state.wrong[s.id]=Array.from(new Set([...(state.wrong[s.id]||[]),...wrongIndices])).filter(i=>i>=0&&i<s.steps.length)}const record={id:Date.now(),name:s.name,skillId:s.id,date:new Date().toLocaleString('ko-KR'),correct,total:s.steps.length,score};state.history.push(record);saveState();render();toast('퀴즈 결과를 저장했습니다.')}
function toggleCheck(id,i,checked){if(!state.checks[id])state.checks[id]=[];state.checks[id][i]=checked;saveState();render()}
function resetChecks(id){state.checks[id]=[];saveState();render();toast('체크리스트를 초기화했습니다.')}
function saveChecklist(id){const s=skill(id),arr=state.checks[id]||[],count=arr.filter(Boolean).length;if(count===s.steps.length){toast('모든 항목을 체크했습니다.');if(!state.learned.includes(id))state.learned.push(id)}else toast(`${s.steps.length-count}개 항목이 아직 체크되지 않았습니다.`);saveState();render()}
function clearWrong(){if(!confirm('저장된 오답 기록을 모두 삭제할까요?'))return;state.wrong={};saveState();render();toast('오답 기록을 삭제했습니다.')}
function clearHistory(){if(!state.history.length){toast('삭제할 퀴즈 기록이 없습니다.');return}if(!confirm('저장된 퀴즈 기록을 모두 삭제할까요?'))return;state.history=[];saveState();render();toast('퀴즈 기록을 삭제했습니다.')}
render();
</script>
</body>
</html>
